<!doctype html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG Workbench</title>
  <meta name="description" content="Agentic RAG workbench cho sách Machine Learning cơ bản: chat, evidence, trace.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230f172a'/%3E%3Cpath d='M7 6h10v12H7z' fill='none' stroke='%2322c55e' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Lịch sử trò chuyện"></aside>

    <main class="main">
      <header class="topbar">
        <button type="button" class="icon-btn only-mobile" data-action="toggle-sidebar" aria-label="Mở lịch sử">
          <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="conv-title" id="conv-title">Cuộc trò chuyện mới</h1>
        <span class="grow"></span>
        <span class="health" id="health" role="status"><i></i>…</span>
        <button type="button" class="icon-btn" data-action="toggle-theme" aria-label="Đổi giao diện sáng/tối">
          <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        </button>
        <button type="button" class="icon-btn only-drawer" data-action="toggle-inspector" aria-label="Mở inspector">
          <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
        </button>
      </header>

      <section class="chat" id="chat" aria-live="polite"></section>

      <div class="composer-wrap">
        <div id="config" class="config"></div>
        <form class="composer" id="composer">
          <label class="sr-only" for="input">Câu hỏi</label>
          <textarea id="input" rows="1" placeholder="Hỏi về nội dung sách…" autocomplete="off"></textarea>
          <button type="submit" class="send" id="send" aria-label="Gửi">
            <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </button>
        </form>
        <p class="hint">Enter để gửi · Shift+Enter xuống dòng · Trả lời chỉ dựa trên book_ML.pdf</p>
      </div>

      <section class="pdf-viewer" id="pdf" hidden tabindex="-1" aria-label="Trình xem PDF"></section>
    </main>

    <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
    <div class="scrim" data-action="close-drawers" aria-hidden="true"></div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
